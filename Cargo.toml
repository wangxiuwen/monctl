[package]
name = "monctl"
version = "0.4.0"
edition = "2021"
description = "The screen assistant: displays on/off, resolutions & HiDPI, mirroring, virtual displays, tablets as extra screens (macOS / Windows / Linux)"
license = "MIT"
repository = "https://github.com/wangxiuwen/monctl"
keywords = ["display", "monitor", "cli", "multi-monitor"]
categories = ["command-line-utilities"]

[[bin]]
name = "monctl"
path = "src/main.rs"

[dependencies]

[profile.release]
strip = true
lto = true
