<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>monctl - 投屏到平板</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --fg: #1d1d1f; --dim: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --card: #2c2c2e; --fg: #f5f5f7; --dim: #98989d; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  .card { background: var(--card); border-radius: 20px; padding: 32px; max-width: 380px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.12); }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .qr { width: 280px; height: 280px; margin: 18px auto; border-radius: 12px; overflow: hidden; background: #fff; }
  .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
  .url { font: 600 18px ui-monospace, SFMono-Regular, Consolas, monospace; word-break: break-all; }
  p { color: var(--dim); line-height: 1.6; margin: 10px 0 0; }
  .count { margin-top: 16px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>投屏到平板</h1>
  <div class="qr"><img src="/qr.svg" alt="QR code"></div>
  <div class="url" id="url"></div>
  <p>用平板相机扫码，或在平板浏览器打开上面的地址。<br>平板会成为这台电脑的一块扩展屏，可以直接触控操作。</p>
  <p>安卓平板插 USB 线（已开 USB 调试）会自动打开，延迟最低。</p>
  <div class="count" id="count"></div>
</div>
<script>
async function poll() {
  try {
    const s = await (await fetch("/status", { cache: "no-store" })).json();
    document.getElementById("url").textContent = s.url;
    document.getElementById("count").textContent = s.tablets ? `已连接 ${s.tablets} 台平板` : "等待平板连接…";
  } catch (e) {
    document.getElementById("count").textContent = "投屏已停止";
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
